; PlatformIO project: ESP32 DevKit + ST LSM6-series IMU over I2C
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 460800
; esp32_exception_decoder turns crash backtraces into file:line
monitor_filters = esp32_exception_decoder

build_flags =
    -Wall
    -Wextra
